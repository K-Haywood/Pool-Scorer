<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool Scorer">
<meta name="theme-color" content="#050c18">
<link rel="apple-touch-icon" href="icon.png">
<title>Pool Scorer Pro</title>
<link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,600,700,800,900&display=swap" rel="stylesheet">
<style>
/* --- CORE THEME & RESET --- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#050c18;color:#e8f0f8;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
input,select,button{font-family:'DM Sans',system-ui,sans-serif;}
input,select{user-select:text;-webkit-user-select:text;}
.flex{display:flex;}.col{flex-direction:column;}.f1{flex:1;}.ac{align-items:center;}.jc{justify-content:center;}.jb{justify-content:space-between;}.fw{flex-wrap:wrap;}

/* --- AURORA BACKGROUND --- */
.bg-orbs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-grid{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:28px 28px;}
.orb{position:absolute;border-radius:50%;opacity:0.25;}
.orb1{width:820px;height:660px;background:radial-gradient(ellipse,rgba(74,143,212,0.38),transparent 70%);top:-240px;left:-240px;}
.orb2{width:660px;height:560px;background:radial-gradient(ellipse,rgba(235,191,82,0.26),transparent 70%);bottom:-190px;right:-170px;}

/* --- GLASS WIDGETS --- */
.widget{position:relative;background:rgba(6,13,26,0.92);border:1px solid rgba(255,255,255,.09);border-radius:14px;margin:10px 16px;padding:20px;}
.widget-hdr{display:flex;align-items:center;margin-bottom:14px;}
.widget-hdr:before{content:'';display:inline-block;width:3px;height:12px;background:#ebbf52;margin-right:8px;border-radius:2px;}
.widget-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(235,191,82,0.7);}

/* --- NAVIGATION --- */
#nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#020608;border-top:1px solid rgba(255,255,255,0.07);display:flex;z-index:100;}
.nb{flex:1;border:none;background:none;color:#5a7898;font-size:9px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-transform:uppercase;padding:0;letter-spacing:0.06em;}
.nb.on{color:#ebbf52;}
.ni{font-size:20px;margin-bottom:3px;}

/* --- BUTTONS & CARDS --- */
.btn{display:flex;align-items:center;justify-content:center;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;min-height:52px;padding:0 22px;background:rgba(6,13,26,0.76);color:#e8f0f8;border:1px solid rgba(255,255,255,0.09);}
.btn-g{background:#ebbf52;color:#050c18;font-weight:700;}
.btn-r{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2);}
.btn-sm{min-height:38px;padding:0 16px;font-size:13px;}

/* --- WIN ENTRY UI --- */
.game-layout{display:flex;flex-direction:column;height:100%;padding:20px;}
.g-players{flex:1;display:flex;flex-direction:column;margin:10px 0;}
.g-card{flex:1;position:relative;background:rgba(6,13,26,0.92);border:1px solid rgba(255,255,255,.12);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;-webkit-transition:border-color 0.2s;transition:border-color 0.2s;}
.g-card.pending{border-color:#ebbf52;background:rgba(235,191,82,0.12);}
.g-name{font-size:52px;font-weight:900;color:#e8f0f8;margin-bottom:8px;text-align:center;letter-spacing:-0.02em;word-wrap:break-word;max-width:90%;}
.g-hint{font-size:11px;color:#5a7898;text-transform:uppercase;letter-spacing:0.15em;font-weight:700;}

.win-progress-wrap{position:absolute;bottom:0;left:0;right:0;height:14px;background:rgba(255,255,255,0.05);display:none;}
.win-progress-bar{height:100%;width:0%;background:#ebbf52;}

/* --- LOCKOUT OVERLAY --- */
#lockout-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(2,6,14,0.98);z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.lock-timer{font-size:92px;font-weight:900;color:#f87171;}
.lock-msg{font-size:18px;color:#5a7898;text-transform:uppercase;letter-spacing:0.1em;margin-top:10px;}

/* --- STATISTICS VIZ --- */
.stats-bar-track{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-top:12px;width:100%;}
.stats-bar-fill{height:100%;background:#ebbf52;width:0%;}
.form-dot{width:10px;height:10px;border-radius:50%;margin-right:6px;}
.form-win{background:#10b981;}
.form-loss{background:#ef4444;}

/* --- SCREENS --- */
.screen{display:none;position:fixed;top:0;left:0;right:0;bottom:76px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:transparent;padding-bottom:120px;z-index:1;}
#screen-onboarding{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:#050c18;}
#screen-game{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:#050c18;}

/* --- PLAYER SELECTION --- */
.pl-grid{display:flex;flex-wrap:wrap;padding:8px;width:100%;}
.pc{width:calc(33.333% - 12px);margin:6px;background:rgba(6,13,26,0.88);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.pc.on{border-color:#ebbf52;background:rgba(235,191,82,0.05);}
.pc-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;margin-bottom:8px;}

/* --- MODAL --- */
#modal{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;background:rgba(2,6,14,0.92);align-items:center;justify-content:center;padding:24px;}
#modal.open{display:flex;}
#mbox{background:rgba(10,18,32,0.99);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;text-align:center;}
#mbtns{display:flex;flex-direction:column;margin-top:24px;}
#mbtns .btn{margin-bottom:10px;}
#mbtns .btn:last-child{margin-bottom:0;}
/* --- HISTORY CARDS --- */
.hcard{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.05);}
.hcard:last-child{border-bottom:none;}
/* --- PLAYER LIST --- */
.pl-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.05);}
.pl-row:last-child{border-bottom:none;}
.pl-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;margin-right:12px;flex-shrink:0;}
.pl-rec{font-size:12px;color:#5a7898;font-weight:700;}
/* --- JUDGE AI --- */
.judge-box{display:flex;align-items:center;}
.judge-inp{flex:1;background:rgba(6,13,26,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px;color:#e8f0f8;font-size:15px;outline:none;margin-right:10px;}
.judge-inp:focus{border-color:rgba(235,191,82,0.4);}
.j-answer-new{background:rgba(235,191,82,0.07);border:1px solid rgba(235,191,82,0.18);border-radius:16px;padding:20px;margin-top:16px;}
.j-answer-old{background:rgba(6,13,26,0.4);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:16px;margin-top:10px;opacity:0.6;}
/* --- PIN PAD --- */
.pin-display{display:flex;justify-content:center;margin:16px 0 20px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);background:transparent;-webkit-transition:background 0.15s,border-color 0.15s;transition:background 0.15s,border-color 0.15s;margin:0 7px;}
.pin-dot.filled{background:#ebbf52;border-color:#ebbf52;}
.pin-pad{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;max-width:240px;margin:0 auto;}
.pin-key{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:14px;color:#e8f0f8;font-size:22px;font-weight:700;min-height:58px;cursor:pointer;-webkit-transition:background 0.1s;transition:background 0.1s;width:calc(33.333% - 8px);margin:4px;}
.pin-key:active{background:rgba(235,191,82,0.25);}
/* --- STATS CHART --- */
.chart-bar-row{display:flex;align-items:center;margin-bottom:10px;}
.chart-bar-label{font-size:12px;font-weight:700;color:#e8f0f8;width:72px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-bar-outer{flex:1;height:22px;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;position:relative;margin:0 8px;}
.chart-bar-inner{height:100%;border-radius:6px;}
.chart-bar-val{font-size:11px;font-weight:700;color:#5a7898;flex-shrink:0;width:28px;text-align:right;}
.stat-grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:6px;}
.stat-cell{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;width:calc(50% - 5px);margin:6px 10px 0 0;}
.stat-cell:nth-child(2n){margin-right:0;}
.stat-cell-val{font-size:20px;font-weight:900;color:#ebbf52;}
.stat-cell-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#5a7898;margin-top:2px;}
/* --- TEAM MEMBERS ON GAME CARD --- */
.g-team-members{font-size:13px;color:rgba(255,255,255,0.5);font-weight:500;text-align:center;max-width:90%;margin:-2px 0 10px;line-height:1.4;}
/* --- VERDICT BADGES --- */
.verdict-badge{display:inline-block;padding:5px 16px;border-radius:8px;font-size:13px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px;}
.vb-foul{background:rgba(249,115,22,0.15);color:#f97316;border:1px solid rgba(249,115,22,0.35);}
.vb-legal{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.35);}
.vb-loss{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.35);}
.vb-info{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.35);}
/* --- LOADING DOTS --- */
@-webkit-keyframes ldot{0%,80%,100%{opacity:0.2}40%{opacity:1}}
@keyframes ldot{0%,80%,100%{opacity:0.2}40%{opacity:1}}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ebbf52;margin:0 3px;-webkit-animation:ldot 1.2s ease-in-out infinite;animation:ldot 1.2s ease-in-out infinite;}
.ldot:nth-child(2){-webkit-animation-delay:0.15s;animation-delay:0.15s;}.ldot:nth-child(3){-webkit-animation-delay:0.3s;animation-delay:0.3s;}
/* --- QUICK CHIPS --- */
.j-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:#94a3b8;cursor:pointer;white-space:nowrap;-webkit-transition:background 0.15s,border-color 0.15s,color 0.15s;transition:background 0.15s,border-color 0.15s,color 0.15s;margin:0 8px 8px 0;}
.j-chip:active{background:rgba(235,191,82,0.15);border-color:rgba(235,191,82,0.35);color:#ebbf52;}
/* --- iOS :ACTIVE PRESS STATES --- */
.btn:active{background:rgba(255,255,255,0.12);}
.btn-g:active{background:#d4aa47;}
.btn-r:active{background:rgba(239,68,68,0.2);}
.nb:active{color:#ebbf52;}
.g-card:active{border-color:rgba(255,255,255,0.3);background:rgba(6,13,26,0.95);}
/* --- GAME TYPE SELECTOR --- */
.gtype-btn{flex:1;min-height:96px;border:2px solid rgba(255,255,255,0.1);border-radius:16px;background:rgba(6,13,26,0.6);color:#5a7898;font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 4px;-webkit-transition:border-color 0.2s,background 0.2s,color 0.2s;transition:border-color 0.2s,background 0.2s,color 0.2s;}
.gtype-btn.on{border-color:#ebbf52;background:rgba(235,191,82,0.1);color:#ebbf52;}
.gtype-btn:active{background:rgba(235,191,82,0.15);}
/* --- SNOOKER SCORING UI --- */
.sn-scores{display:flex;margin:10px 0 16px;}
.sn-score-card{flex:1;padding:18px 10px;background:rgba(6,13,26,0.92);border:2px solid rgba(255,255,255,0.1);border-radius:16px;margin:0 6px;text-align:center;cursor:pointer;-webkit-transition:border-color 0.2s,background 0.2s;transition:border-color 0.2s,background 0.2s;}
.sn-score-card.on{border-color:#ebbf52;background:rgba(235,191,82,0.08);}
.sn-name{font-size:15px;font-weight:700;color:#94a3b8;margin-bottom:6px;letter-spacing:0.05em;}
.sn-score-card.on .sn-name{color:#ebbf52;}
.sn-score{font-size:62px;font-weight:900;color:#fff;line-height:1;}
.sn-meta{font-size:11px;color:#5a7898;margin-top:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.sn-balls{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;margin:10px 0;}
.sn-ball{width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:5px;font-weight:900;color:#fff;-webkit-tap-highlight-color:transparent;}
.sn-ball:active{border-color:#ebbf52;}
.sn-ball-red{background:#dc2626;}
.sn-ball-yellow{background:#facc15;color:#1a1a1a;}
.sn-ball-green{background:#16a34a;}
.sn-ball-brown{background:#854d0e;}
.sn-ball-blue{background:#2563eb;}
.sn-ball-pink{background:#ec4899;}
.sn-ball-black{background:#0f172a;border-color:rgba(255,255,255,0.3);}
.sn-ball-val{font-size:26px;line-height:1;}
.sn-ball-lbl{font-size:9px;letter-spacing:0.1em;margin-top:2px;opacity:0.7;}
.sn-status{text-align:center;font-size:14px;color:#5a7898;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin:8px 0 14px;}
.sn-actions{display:flex;margin:8px 0 14px;}
.sn-act{flex:1;min-height:54px;border:1px solid rgba(255,255,255,0.1);background:rgba(6,13,26,0.7);color:#e8f0f8;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin:0 4px;text-transform:uppercase;letter-spacing:0.08em;}
.sn-act:active{background:rgba(255,255,255,0.08);}
.sn-act-foul{background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.3);}
.sn-act-foul:active{background:rgba(239,68,68,0.25);}
.sn-act-undo{flex:0 0 60px;}
.sn-end{width:100%;min-height:62px;background:#ebbf52;color:#050c18;font-weight:800;border:none;border-radius:14px;font-size:16px;cursor:pointer;text-transform:uppercase;letter-spacing:0.1em;}
.sn-end:active{background:#d4aa47;}
.sn-ball-dim{opacity:0.22;}
/* --- STATS FILTER CHIPS --- */
.stat-chip{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(6,13,26,0.7);color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin:0 4px 0 0;text-transform:uppercase;letter-spacing:0.05em;-webkit-transition:background 0.15s,color 0.15s;transition:background 0.15s,color 0.15s;}
.stat-chip.on{background:#ebbf52;color:#050c18;border-color:#ebbf52;}
</style>
</head>
<body onclick="handleGlobalClick(event)">

<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="bg-grid"></div>

<!-- LOCKOUT OVERLAY -->
<div id="lockout-overlay">
    <div class="lock-timer" id="lockout-timer">60s</div>
    <div class="lock-msg">System Locked for Abuse</div>
    <div id="pin-entry" style="display:none;margin-top:28px;width:100%;max-width:260px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#5a7898;margin-bottom:4px;text-align:center;">Admin PIN</div>
        <div class="pin-display">
            <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
            <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
        </div>
        <div class="pin-pad">
            <button class="pin-key btn" onclick="pinKey('1')">1</button>
            <button class="pin-key btn" onclick="pinKey('2')">2</button>
            <button class="pin-key btn" onclick="pinKey('3')">3</button>
            <button class="pin-key btn" onclick="pinKey('4')">4</button>
            <button class="pin-key btn" onclick="pinKey('5')">5</button>
            <button class="pin-key btn" onclick="pinKey('6')">6</button>
            <button class="pin-key btn" onclick="pinKey('7')">7</button>
            <button class="pin-key btn" onclick="pinKey('8')">8</button>
            <button class="pin-key btn" onclick="pinKey('9')">9</button>
            <button class="pin-key btn" style="font-size:13px;" onclick="pinClear()">CLR</button>
            <button class="pin-key btn" onclick="pinKey('0')">0</button>
            <button class="pin-key btn" style="font-size:16px;" onclick="pinBack()">⌫</button>
        </div>
        <div id="pin-err" style="font-size:12px;color:#f87171;text-align:center;margin-top:10px;min-height:16px;"></div>
    </div>
    <button onclick="togglePinEntry()" style="margin-top:48px;font-size:11px;color:rgba(255,255,255,0.25);background:none;border:none;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;padding:8px;">Admin Override</button>
</div>

<!-- ONBOARDING -->
<div id="screen-onboarding">
  <div class="flex col ac jc" style="height:100%;padding:32px;">
    <div style="width:120px;height:110px;background:#000;border:3px solid #ebbf52;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#ebbf52;margin-bottom:32px;">8</div>
    <div style="font-size:42px;font-weight:900;margin-bottom:48px;letter-spacing:-0.03em;">Pool Scorer Pro</div>
    <div style="width:100%;max-width:380px;">
      <div class="flex" style="margin-bottom:24px;">
        <input type="text" id="ob-in" class="btn f1" style="text-align:left;cursor:text;margin-right:12px;" placeholder="Player Name..." maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" onkeydown="if(event.keyCode===13)obAdd()">
        <button class="btn btn-g btn-sm" onclick="obAdd()">Add</button>
      </div>
      <div id="ob-list"></div>
      <button id="ob-start" class="btn" style="width:100%;margin-top:24px;opacity:0.4;font-size:16px;" onclick="obStart()">Ready to Play</button>
    </div>
  </div>
</div>

<!-- PLAY / SETUP -->
<div id="screen-setup" class="screen">
  <div class="hdr" style="padding:28px 24px 14px;display:flex;align-items:center;justify-content:space-between;position:-webkit-sticky;position:sticky;top:0;background:rgba(2,6,14,0.97);z-index:10;border-bottom:1px solid rgba(255,255,255,0.05);">
      <span class="hdr-title" style="font-size:10px;font-weight:700;color:rgba(235,191,82,0.7);text-transform:uppercase;letter-spacing:.12em;">New Game</span>
  </div>
  <div style="padding:14px 16px 0;display:flex;">
    <button id="gt-8ball" class="gtype-btn on" onclick="setGameMode('8ball')">
      <span style="font-size:28px;font-weight:900;margin-bottom:2px;">8</span>
      <span style="font-size:13px;letter-spacing:0.05em;">8 Ball</span>
    </button>
    <button id="gt-snooker" class="gtype-btn" onclick="setGameMode('snooker')">
      <span style="font-size:24px;margin-bottom:2px;">&#9679;</span>
      <span style="font-size:13px;letter-spacing:0.05em;">Snooker</span>
    </button>
  </div>
  <div id="sn-layout-hint" style="display:none;margin:10px 16px 0;">
    <button onclick="snookerShowLayout()" style="width:100%;background:rgba(235,191,82,0.07);border:1px solid rgba(235,191,82,0.2);border-radius:12px;color:#ebbf52;font-size:13px;font-weight:700;padding:12px;cursor:pointer;letter-spacing:0.05em;">&#9654; View Ball Starting Positions</button>
  </div>
  <div class="mode-toggle" style="display:flex;background:rgba(4,9,18,0.8);border-radius:14px;padding:4px;margin:12px 16px;border:1px solid rgba(255,255,255,0.07);">
    <button id="mb-s" class="btn f1" style="border:none;background:none;color:#ebbf52;" onclick="selMode('singles')">1 vs 1</button>
    <button id="mb-t" class="btn f1" style="border:none;background:none;color:#5a7898;" onclick="selMode('teams')">Teams</button>
  </div>
  <div id="ss-singles">

<script>
// ==========================================
// DB & PERSISTENCE
// ==========================================
var DB = {
  gp: function() { try { var d=localStorage.getItem('pp'); return d?JSON.parse(d):[]; } catch(e){ return []; } },
  sp: function(a) { localStorage.setItem('pp', JSON.stringify(a)); },
  gg: function() { try { var d=localStorage.getItem('pg'); return d?JSON.parse(d):[]; } catch(e){ return []; } },
  sg: function(a) { localStorage.setItem('pg', JSON.stringify(a)); },
  ag: function(g) { var a = DB.gg(); a.push(g); DB.sg(a); }
};

var curGame=null, gameStart=null, timerIv=null, lastSetup=null, _longPress=false;
var gameMode='8ball';
var ss={mode:'singles',sel:[],tA:[],tB:[]}, judgeHistory=[], obPl=[];
var snookerState=null;
var statsFilter='all';

// ==========================================
// WIN CONTROLLER (Zero-Friction + Cancel)
// ==========================================
var WinController = {
    CONFIRM_TIME: 2500,
    RATE_LIMIT: 5000,
    LOCKOUT_DUR: 60000,
    pendingId: null,
    timer: null,
    blockedAttempts: [],

    handleTap: function(playerId) {
        var now = Date.now();
        
        // 1. Check Lockout
        var lockoutEnd = parseInt(localStorage.getItem('lock_end') || 0);
        if (now < lockoutEnd) { this.showLockout(); return; }
        
        // 2. Tapping already pending player? CANCEL.
        if (this.pendingId === playerId) { this.cancel(); return; }
        
        // 3. Check Cooldown
        var lastWin = parseInt(localStorage.getItem('last_win_ts') || 0);
        if (now - lastWin < this.RATE_LIMIT) { this.logBlocked(now); return; }

        this.startFlow(playerId);
    },
    startFlow: function(id) {
        var self = this;
        this.cancel();
        this.pendingId = id;
        
        var card = document.getElementById('g-card-' + id);
        var bar = document.getElementById('bar-' + id);
        var wrap = document.getElementById('wrap-' + id);
        if(!card || !bar || !wrap) return;
        
        document.getElementById('game-instr').innerText = "Hold to Confirm...";
        card.className += ' pending';
        wrap.style.display = 'block';
        bar.style.transition = 'none';
        bar.style.width = '0%';
        void bar.offsetWidth; // force reflow
        bar.style.transition = 'width ' + this.CONFIRM_TIME + 'ms linear';
        bar.style.width = '100%';
        
        this.timer = setTimeout(function() { self.commit(id); }, this.CONFIRM_TIME);
    },
    commit: function(id) {
        localStorage.setItem('last_win_ts', Date.now());
        this.cancel();
        saveGame(id);
    },
    cancel: function() {
        if(this.timer) clearTimeout(this.timer);
        this.timer = null;
        this.pendingId = null;
        
        document.getElementById('game-instr').innerText = gameMode==='snooker'?"Tap the Frame Winner":"Tap the Winner to Score";
        var cards = document.querySelectorAll('.g-card');
        var wraps = document.querySelectorAll('.win-progress-wrap');
        var bars = document.querySelectorAll('.win-progress-bar');
        for(var i=0; i<cards.length; i++) cards[i].className = cards[i].className.replace(' pending','');
        for(var j=0; j<wraps.length; j++) wraps[j].style.display = 'none';
        for(var k=0; k<bars.length; k++) { bars[k].style.transition = 'none'; bars[k].style.width = '0%'; }
    },
    logBlocked: function(ts) {
        var self = this;
        this.blockedAttempts = this.blockedAttempts.filter(function(t){ return ts - t < 5000; });
        this.blockedAttempts.push(ts);
        if (this.blockedAttempts.length >= 3) {
            localStorage.setItem('lock_end', ts + this.LOCKOUT_DUR);
            this.showLockout();
        }
    },
    showLockout: function() {
        var el = document.getElementById('lockout-overlay');
        var txt = document.getElementById('lockout-timer');
        el.style.display = 'flex';
        var update = function() {
            var remain = parseInt(localStorage.getItem('lock_end') || 0) - Date.now();
            if (remain <= 0) { el.style.display = 'none'; _pinBuf=''; _pinFails=0; _pinLocked=false; }
            else { txt.innerText = Math.ceil(remain/1000) + 's'; setTimeout(update, 1000); }
        };
        update();
    }
};

function handleGlobalClick(e) {
    if (WinController.pendingId !== null) {
        var modal = document.getElementById('modal');
        if (modal && modal.style.display === 'flex') return;
        var playerArea = document.getElementById('g-player-tracker');
        if (playerArea && !playerArea.contains(e.target)) {
            WinController.cancel();
        }
    }
}

function adminOverride() {
    WinController.cancel();
    var lo = document.getElementById('lockout-overlay');
    lo.style.display = 'flex';
    togglePinEntry(true);
}
var _pinBuf = '', _pinFails = 0, _pinLocked = false;
function togglePinEntry(forceShow) {
    var el = document.getElementById('pin-entry');
    var show = forceShow === true ? true : el.style.display === 'none';
    el.style.display = show ? 'block' : 'none';
    if (show) { _pinBuf = ''; _pinFails = 0; _pinLocked = false; _pinRender(); _pinErr(''); }
}
function pinKey(k) {
    if (_pinLocked || _pinBuf.length >= 4) return;
    _pinBuf += k;
    _pinRender();
    if (_pinBuf.length === 4) setTimeout(pinCheck, 150);
}
function pinBack() { if(!_pinLocked){ _pinBuf = _pinBuf.slice(0, -1); _pinRender(); } }
function pinClear() { if(!_pinLocked){ _pinBuf = ''; _pinRender(); _pinErr(''); } }
function _pinRender() {
    for (var i = 0; i < 4; i++) {
        var d = document.getElementById('pd' + i);
        if (d) d.className = 'pin-dot' + (i < _pinBuf.length ? ' filled' : '');
    }
}
function _pinErr(msg) { var e=document.getElementById('pin-err'); if(e) e.innerText=msg; }
function pinCheck() {
    var stored = localStorage.getItem('admin_pin') || '0304';
    if (_pinBuf === stored) {
        _pinFails = 0; _pinLocked = false;
        localStorage.setItem('lock_end', 0);
        document.getElementById('lockout-overlay').style.display = 'none';
        document.getElementById('pin-entry').style.display = 'none';
        WinController.blockedAttempts = [];
        WinController.cancel();
        _pinBuf = '';
    } else {
        _pinFails++;
        _pinBuf = ''; _pinRender();
        var delay = Math.min(1000 * _pinFails, 8000);
        _pinLocked = true;
        _pinErr(_pinFails >= 3 ? 'Too many attempts — wait ' + Math.ceil(delay/1000) + 's' : 'Incorrect PIN');
        setTimeout(function(){ _pinLocked = false; _pinErr(''); }, delay);
    }
}

// ==========================================
// CORE NAVIGATION & SETUP
// ==========================================
function go(tab) {
  var sc = ['setup','stats','history','rules','players','game','onboarding'];
  for(var i=0; i<sc.length; i++) {
      var el = document.getElementById('screen-'+sc[i]);
      if(el) el.style.display = 'none';
  }
  
  if(tab === 'play') { setupInit(); document.getElementById('screen-setup').style.display = 'block'; document.getElementById('screen-onboarding').style.display = 'none'; }
  else { var target = document.getElementById('screen-'+tab); if(target) target.style.display = 'block'; }
  
  var nbs = document.querySelectorAll('.nb');
  for(var i=0; i<nbs.length; i++) nbs[i].className = nbs[i].className.replace(' on','');
  var n = document.getElementById('nb-'+(tab==='play'?'play':tab));
  if(n) n.className += ' on';
  
  document.getElementById('nav').style.display = (tab === 'game' ? 'none' : 'flex');
  
  if(tab === 'stats') renderStats();
  if(tab === 'history') renderHist();
  if(tab === 'players') renderPl();
}

function selMode(m){
  ss.mode=m;
  document.getElementById('mb-s').className='btn f1'+(m==='singles'?' btn-g':'');
  document.getElementById('mb-s').style.background = m==='singles'?'#ebbf52':'none';
  document.getElementById('mb-s').style.color = m==='singles'?'#050c18':'#5a7898';
  document.getElementById('mb-t').className='btn f1'+(m==='teams'?' btn-g':'');
  document.getElementById('mb-t').style.background = m==='teams'?'#ebbf52':'none';
  document.getElementById('mb-t').style.color = m==='teams'?'#050c18':'#5a7898';

// ==========================================
// SNOOKER SCORING
// ==========================================
function _snookerInit(){
  snookerState={scores:[0,0],currentPlayer:0,currentBreak:0,redsLeft:15,highestBreak:[0,0],fouls:[0,0],history:[],expectingRed:true,colourSeqIdx:-1};
}
function _snookerSnap(){
  return {scores:snookerState.scores.slice(),currentPlayer:snookerState.currentPlayer,currentBreak:snookerState.currentBreak,redsLeft:snookerState.redsLeft,highestBreak:snookerState.highestBreak.slice(),fouls:snookerState.fouls.slice(),expectingRed:snookerState.expectingRed,colourSeqIdx:snookerState.colourSeqIdx};
}
function _snookerRestore(s){
  snookerState.scores=s.scores.slice();
  snookerState.currentPlayer=s.currentPlayer;
  snookerState.currentBreak=s.currentBreak;
  snookerState.redsLeft=s.redsLeft;
  snookerState.highestBreak=s.highestBreak.slice();
  snookerState.fouls=s.fouls.slice();
  snookerState.expectingRed=s.expectingRed;
  snookerState.colourSeqIdx=s.colourSeqIdx;
}
var SN_BALLS=[{c:'red',v:1,n:'Red'},{c:'yellow',v:2,n:'Yellow'},{c:'green',v:3,n:'Green'},{c:'brown',v:4,n:'Brown'},{c:'blue',v:5,n:'Blue'},{c:'pink',v:6,n:'Pink'},{c:'black',v:7,n:'Black'}];
var SN_COLOUR_SEQ=[2,3,4,5,6,7];
var SN_COLOUR_NAMES={2:'Yellow',3:'Green',4:'Brown',5:'Blue',6:'Pink',7:'Black'};
function _snookerIsValid(v){
  var s=snookerState;
  if(s.colourSeqIdx>=0) return s.colourSeqIdx<6 && v===SN_COLOUR_SEQ[s.colourSeqIdx];
  if(s.expectingRed) return v===1;
  return v>=2;
}
function _snookerFoulPts(){
  var s=snookerState;
  if(s.colourSeqIdx>=0 && s.colourSeqIdx<6) return Math.max(4,SN_COLOUR_SEQ[s.colourSeqIdx]);
  return 4;
}
function _snookerRenderBalls(){
  if(!snookerState) return;
  var html='';
  for(var i=0;i<SN_BALLS.length;i++){
    var b=SN_BALLS[i];
    var dimCls=_snookerIsValid(b.v)?'':' sn-ball-dim';
    html+='<button class="sn-ball sn-ball-'+b.c+dimCls+'" onclick="snookerPot('+b.v+')">'+
          '<span class="sn-ball-val">'+b.v+'</span>'+
          '<span class="sn-ball-lbl">'+b.n+'</span>'+
          '</button>';
  }
  document.getElementById('sn-balls').innerHTML=html;
}
function _snookerActionsRender(){
  document.getElementById('sn-actions').innerHTML=
    '<button class="sn-act sn-act-foul" onclick="snookerMiss()">Miss +4</button>'+
    '<button class="sn-act" onclick="snookerSafe()">Safe</button>'+
    '<button class="sn-act sn-act-foul" onclick="snookerFoulPrompt()">Foul</button>'+
    '<button class="sn-act sn-act-undo" onclick="snookerUndo()">&#8634;</button>';
}
function _snookerRender(){
  if(!snookerState||!curGame) return;
  var p0=byId(curGame.pids[0]), p1=byId(curGame.pids[1]);
  var n0=p0?p0.name:'Player 1', n1=p1?p1.name:'Player 2';
  var html='';
  for(var i=0;i<2;i++){
    var n=i===0?n0:n1;
    var active=snookerState.currentPlayer===i;
    var meta=active?('Break: '+snookerState.currentBreak):('HB: '+snookerState.highestBreak[i]+' &bull; TAP TO SWITCH');
    html+='<div class="sn-score-card'+(active?' on':'')+'" onclick="snookerSwitchPlayer('+i+')">'+
          '<div class="sn-name">'+esc(n)+'</div>'+
          '<div class="sn-score">'+snookerState.scores[i]+'</div>'+
          '<div class="sn-meta">'+meta+'</div>'+
          '</div>';
  }
  document.getElementById('sn-scores').innerHTML=html;
  var status;
  if(snookerState._foulMsg){
    status='<span style="color:#f87171;font-size:13px;">'+snookerState._foulMsg+'</span>';
    snookerState._foulMsg=null;
  } else if(snookerState.colourSeqIdx>=6){
    status='All balls potted — tap End Frame';
  } else if(snookerState.colourSeqIdx>=0){
    var nv=SN_COLOUR_SEQ[snookerState.colourSeqIdx];
    status='Pot the <span style="color:#ebbf52;">'+SN_COLOUR_NAMES[nv]+'</span> ('+nv+' pts)';
  } else if(snookerState.expectingRed){
    status='Pot a red &bull; '+snookerState.redsLeft+(snookerState.redsLeft===1?' red left':' reds left');
  } else {
    status='Now pot any colour';
  }
  document.getElementById('sn-status').innerHTML=status;
  _snookerRenderBalls();
}
function _snookerPassTurn(){
  if(snookerState.colourSeqIdx<0){
    if(snookerState.redsLeft>0){
      snookerState.expectingRed=true;
    } else {
      snookerState.colourSeqIdx=0;
    }
  }
}
function snookerPot(value){
  if(!snookerState) return;
  snookerState.history.push(_snookerSnap());
  if(!_snookerIsValid(value)){
    var fp=_snookerFoulPts();
    var p=snookerState.currentPlayer;
    var opp=byId(curGame.pids[1-p]);
    var oppName=opp?opp.name:'opponent';
    snookerState.scores[1-p]+=fp;
    snookerState.fouls[p]++;
    snookerState.currentBreak=0;
    snookerState.currentPlayer=1-p;
    _snookerPassTurn();
    snookerState._foulMsg='Wrong ball — +'+fp+' to '+esc(oppName);
    _snookerActionsRender();
    _snookerRender();
    return;
  }
  var p=snookerState.currentPlayer;
  snookerState.scores[p]+=value;
  snookerState.currentBreak+=value;
  if(value===1){
    snookerState.redsLeft--;
    snookerState.expectingRed=false;
  } else {
    if(snookerState.colourSeqIdx>=0){
      snookerState.colourSeqIdx++;
    } else if(snookerState.redsLeft===0 && !snookerState.expectingRed){
      snookerState.colourSeqIdx=0;
    } else {
      snookerState.expectingRed=true;
    }
  }
  if(snookerState.currentBreak>snookerState.highestBreak[p]) snookerState.highestBreak[p]=snookerState.currentBreak;
  _snookerRender();
}
function snookerMiss(){
  if(!snookerState) return;
  snookerState.history.push(_snookerSnap());
  var p=snookerState.currentPlayer;
  var opp=byId(curGame.pids[1-p]);
  snookerState.scores[1-p]+=4;
  snookerState.fouls[p]++;
  snookerState.currentBreak=0;
  snookerState.currentPlayer=1-p;
  _snookerPassTurn();
  snookerState._foulMsg='Miss — +4 to '+(opp?esc(opp.name):'opponent');
  _snookerActionsRender();
  _snookerRender();
}
function snookerSafe(){
  if(!snookerState) return;
  snookerState.history.push(_snookerSnap());
  snookerState.currentBreak=0;
  snookerState.currentPlayer=1-snookerState.currentPlayer;
  _snookerPassTurn();
  snookerState._foulMsg='Safe — turn passes, no penalty';
  _snookerActionsRender();
  _snookerRender();
}
function snookerFoulPrompt(){
  document.getElementById('sn-actions').innerHTML=
    '<button class="sn-act sn-act-foul" onclick="snookerFoul(4)">+4</button>'+
    '<button class="sn-act sn-act-foul" onclick="snookerFoul(5)">+5</button>'+
    '<button class="sn-act sn-act-foul" onclick="snookerFoul(6)">+6</button>'+
    '<button class="sn-act sn-act-foul" onclick="snookerFoul(7)">+7</button>'+
    '<button class="sn-act" onclick="_snookerActionsRender()">Cancel</button>';
}
function snookerFoul(points){
  if(!snookerState) return;
  snookerState.history.push(_snookerSnap());
  var p=snookerState.currentPlayer;
  var opp=byId(curGame.pids[1-p]);
  snookerState.scores[1-p]+=points;
  snookerState.fouls[p]++;
  snookerState.currentBreak=0;
  snookerState.currentPlayer=1-p;
  _snookerPassTurn();
  snookerState._foulMsg='Foul +'+points+' to '+(opp?esc(opp.name):'opponent');
  _snookerActionsRender();
  _snookerRender();
}
function snookerUndo(){
  if(!snookerState||!snookerState.history.length) return;
  _snookerRestore(snookerState.history.pop());
  _snookerRender();
}
function snookerSwitchPlayer(i){
  if(!snookerState||snookerState.currentPlayer===i) return;
  snookerState.history.push(_snookerSnap());
  snookerState.currentBreak=0;
  snookerState.currentPlayer=i;
  _snookerRender();
}
function snookerEndFramePrompt(){
  if(!snookerState) return;
  var s0=snookerState.scores[0], s1=snookerState.scores[1];
  if(s0!==s1){
    snookerSaveFrame(curGame.pids[s0>s1?0:1]);
  } else {
    var p0=byId(curGame.pids[0]), p1=byId(curGame.pids[1]);
    var n0=p0?p0.name:'Player 1', n1=p1?p1.name:'Player 2';
    Modal.show('Tied — Who Won?',
      '<div style="font-size:36px;font-weight:900;color:#fff;">'+s0+' &mdash; '+s1+'</div>'+
      '<div style="font-size:12px;color:#5a7898;margin-top:8px;">Scores are equal — tap the winner</div>',
      [
        {label:n0,cls:'btn-g',fn:function(){snookerSaveFrame(curGame.pids[0]);}},
        {label:n1,cls:'btn-g',fn:function(){snookerSaveFrame(curGame.pids[1]);}},
        {label:'Cancel',fn:Modal.hide}
      ]
    );
  }
}
function snookerSaveFrame(winnerId){
  Modal.hide();
  if(timerIv) clearInterval(timerIv);
  var dur=Math.floor((Date.now()-gameStart)/1000);
  var gid=uid();
  var hb={}, fls={};
  hb[curGame.pids[0]]=snookerState.highestBreak[0];
  hb[curGame.pids[1]]=snookerState.highestBreak[1];
  fls[curGame.pids[0]]=snookerState.fouls[0];
  fls[curGame.pids[1]]=snookerState.fouls[1];
  var snookerData={scoreA:snookerState.scores[0],scoreB:snookerState.scores[1],highestBreak:hb,fouls:fls};
  DB.ag({id:gid,gameType:'snooker',mode:'singles',date:Date.now(),wid:winnerId,pids:curGame.pids.slice(),tA:null,tB:null,dur:dur,wt:null,snookerData:snookerData});
  var winner=byId(winnerId);
  var wn=winner?winner.name:'Winner';
  var maxHb=Math.max(snookerState.highestBreak[0],snookerState.highestBreak[1]);
  Modal.show(wn+' Wins the Frame!',
    'Final score: '+snookerState.scores[0]+' &mdash; '+snookerState.scores[1]+'<br>'+
    'Highest break: '+maxHb+'<br>'+
    'Duration: '+fmtDur(dur),
    [
      {label:'Rematch',cls:'btn-g',fn:function(){Modal.hide();snookerState=null;rematch();}},
      {label:'New Match',fn:function(){Modal.hide();snookerState=null;go('play');}}
    ]
  );
}

function snookerShowLayout(){
  var svg=
    '<div style="text-align:center;padding:4px 0 6px;">'+

    '<circle cx="10" cy="145" r="5.5" fill="#050c18"/>'+

var JUDGE_SYSTEM='You are a pool referee using standard pub rules. Give only the ruling — no reasoning, no deliberation, no "however" or "but actually". Output stops after two short paragraphs.\n\n'+
'STRICT FORMAT:\n'+
'[VERDICT]\n'+
'\n'+
'[What happened: 1-2 sentences. State the rule that applies.]\n'+
'\n'+
'[What\'s next: 1 sentence. What the players do now.]\n\n'+
'VERDICT must be exactly one of: FOUL / LEGAL / LOSS / INFO\n'+
'INFO = special situation that is not a foul, win, or loss.\n'+
'Maximum 45 words after the verdict. Stop writing after the second paragraph.\n\n'+
'═══ STANDARD PUB POOL RULES (8-BALL) ═══\n\n'+
'FOUL PENALTY (applies to ALL fouls unless stated otherwise):\n'+
'Opponent gets TWO shots. On their first shot they may hit any ball — no restriction. If they pot on the first shot they still take the second shot. The cue ball is played from where it lies UNLESS there was a scratch (cue ball pocketed), in which case the cue ball is placed anywhere behind the baulk line (the line at the top of the table).\n\n'+
'THE BREAK:\n'+
'• 8-ball pocketed on the break: INFO — re-rack and break again. Not a win or a loss.\n'+
'• Scratch on the break (cue ball pocketed): FOUL — cue ball behind baulk line, opponent gets two shots.\n'+
'• Object ball flies off the table on the break: FOUL — ball is spotted, opponent gets two shots.\n'+
'• After the break the table is always OPEN. Groups (spots/stripes or reds/yellows) are NEVER assigned on the break regardless of what was pocketed.\n\n'+
'OPEN TABLE / ASSIGNING GROUPS:\n'+
'• On an open table either player may hit any non-8-ball first.\n'+
'• Hitting the 8-ball first on an open table: FOUL — two shots.\n'+
'• Groups are assigned by the first ball legally pocketed on a non-break shot. Whichever ball drops first assigns that group to the shooter.\n'+
'• Pocketing a ball on the break does NOT assign groups. Table stays open.\n'+
'• On an open table: hitting one group first but pocketing the other = LEGAL, you are assigned the group you pocketed.\n'+
'• On an open table: missed intended ball, accidentally pocketed opponent\'s group ball = LEGAL if a non-8 was contacted first. You are assigned that group. You keep shooting.\n\n'+
'LEGAL SHOT (must meet BOTH):\n'+
'1. Cue ball contacts one of your own group first (open table: any non-8 ball).\n'+
'2. After contact: at least one ball must be pocketed OR reach a cushion.\n'+
'Fail either condition = FOUL (two shots).\n\n'+
'FOULS (opponent gets two shots, cue ball from where it lies unless scratch):\n'+
'• Cue ball scratch (pocketed) — cue ball behind baulk line\n'+
'• Cue ball driven off the table — cue ball behind baulk line\n'+
'• Potting opponent\'s ball — FOUL even if accidental; their ball stays pocketed\n'+
'• Wrong ball contacted first (opponent\'s group or 8-ball when not on 8)\n'+
'• No ball pocketed AND no ball reaches a cushion after contact\n'+
'• Moving any ball with body, clothing, or cue accidentally\n'+
'• Shooting out of turn, double-hit, push shot, foot off floor\n'+
'• Object ball (not cue ball) driven off the table: FOUL — spot the ball, two shots\n'+
'• Frozen ball (cue ball touching object ball): must pocket a ball OR drive a ball to a cushion — otherwise foul\n\n'+
'LOSS OF GAME:\n'+
'• Potting the 8-ball before clearing all your own group\n'+
'• 8-ball goes in off a foul (e.g. you foul and 8-ball also drops) = LOSS\n'+
'• 8-ball driven off the table\n'+
'• Cue ball scratch when potting the 8-ball = LOSS\n'+
'• 8-ball potted in wrong pocket = LOSS (must nominate pocket before shooting)\n\n'+
'LEGAL / SPECIAL CASES:\n'+
'• Hitting 8-ball first when trying to win but missing, opponent\'s ball accidentally drops: NOT a loss — FOUL only (two shots)\n'+
'• 8-ball called corner right, goes into corner left: LOSS — wrong pocket\n'+
'• Ball teeters on pocket edge then falls in after all balls have stopped: spot it — does not count\n'+
'• Jump shot with normal cue tip: LEGAL if cue tip strikes ball correctly\n'+
'• Ball rolls along rail and returns to table: spot it, FOUL, two shots\n'+
'• Cue ball enters pocket but bounces back onto table: FOUL (scratch) — it entered the pocket\n'+
'• Scratch potting your last group ball: FOUL — game does not end, two shots to opponent\n'+
'• No calling required for any shot except the 8-ball (must nominate pocket)';

var JUDGE_SYSTEM_SNOOKER='You are a snooker referee. Give only the ruling — no reasoning, no deliberation. Output stops after two short paragraphs.\n\n'+
'STRICT FORMAT:\n'+
'[VERDICT]\n'+'\n'+
'[What happened: 1-2 sentences. State the rule and points penalty if foul.]\n'+'\n'+
'[What\'s next: 1 sentence.]\n\n'+
'VERDICT must be exactly one of: FOUL / LEGAL / LOSS / INFO\n'+
'Maximum 50 words after the verdict. Stop after the second paragraph.\n\n'+
'═══ SNOOKER RULES ═══\n\n'+
'BALL VALUES: Red=1pt, Yellow=2, Green=3, Brown=4, Blue=5, Pink=6, Black=7.\n\n'+
'SEQUENCE OF PLAY:\n'+
'• Pot a red first, then nominate and pot a colour (colour returned to its spot). Repeat until all reds gone.\n'+
'• Once all reds potted: pot colours in order — Yellow → Green → Brown → Blue → Pink → Black. Each colour is now left pocketed.\n\n'+
'FOUL PENALTY (opponent receives points, minimum 4):\n'+
'• Penalty = highest of: value of ball "on" OR value of wrongly-struck ball OR value of wrongly-pocketed ball.\n'+
'• Failing to hit any ball: 4 pts to opponent.\n'+
'• Cue ball pocketed (in-off): minimum 4 pts, or value of ball "on" if higher.\n'+
'• Ball driven off table: foul — return ball to its spot, same penalty.\n'+
'• Touching any ball with body, clothing, or non-cue-tip: foul.\n'+
'• Potting the wrong colour when a specific colour is "on": foul — both balls returned to their spots.\n\n'+
'FREE BALL:\n'+
'• After a foul, if the striker is snookered on ALL balls "on", they may claim a free ball.\n'+
'• Opponent nominates any ball as the free ball; it counts as the ball "on" for that one shot only.\n'+
'• If free ball is potted it scores as the ball it replaced (e.g. 1 if replacing a red).\n\n'+
'FRAME WIN:\n'+
'• Player with more points wins the frame.\n'+
'• A player may concede at any time.\n'+
'• If tied when only black remains: re-spot black, lag determines who shoots.\n\n'+
'USE INFO for: snooker questions, free ball claims, score queries, frame-over situations.\n'+
'USE LOSS only when a player concedes the frame or is mathematically beaten.';

function callGroq(q,cb){
  var k=localStorage.getItem('judge_key'); if(!k){cb('No API key set',null);return;}
  var xhr=new XMLHttpRequest(); xhr.open('POST','https://api.groq.com/openai/v1/chat/completions',true);
  xhr.timeout=15000;
  xhr.setRequestHeader('Content-Type','application/json'); xhr.setRequestHeader('Authorization','Bearer '+k);
  xhr.onload=function(){ try{var d=JSON.parse(xhr.responseText); if(xhr.status===200)cb(null,d.choices[0].message.content); else cb('API error ('+xhr.status+')',null);}catch(e){cb('Bad response',null);}};
  xhr.onerror=function(){ cb('Network error',null); };
  xhr.ontimeout=function(){ cb('Request timed out',null); };
  var sysPrompt=gameMode==='snooker'?JUDGE_SYSTEM_SNOOKER:JUDGE_SYSTEM;
  xhr.send(JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sysPrompt},{role:'user',content:q}],max_tokens:150,temperature:0,seed:8675309}));
}

var VERDICT_STYLE={FOUL:'vb-foul',LEGAL:'vb-legal',LOSS:'vb-loss',INFO:'vb-info'};
function parseVerdict(text){
    if(!text) return null;
    var m=(text).match(/^[ \t]*(FOUL|LEGAL|LOSS|INFO)[ \t]*(\n|$)/m);
    return m?m[1]:null;
}
var PARA_LABELS=['What happened','What\'s next'];
function _buildJudgeItem(item, isFirst){
    var d=document.createElement('div'); d.className=isFirst?'j-answer-new':'j-answer-old';
    d.innerHTML='<div style="font-size:11px;opacity:0.45;margin-bottom:10px;display:flex;align-items:center;"><span style="color:#ebbf52;margin-right:6px;">&#9654;</span>'+esc(item.q)+'</div>';
    if(item.loading){
        d.innerHTML+='<div style="margin:6px 0 4px;"><span class="ldot"></span><span class="ldot"></span><span class="ldot"></span></div>';
    } else {
        var verdict=parseVerdict(item.text||'');
        if(verdict) d.innerHTML+='<div style="margin-bottom:12px;"><span class="verdict-badge '+VERDICT_STYLE[verdict]+'">'+verdict+'</span></div>';
        var body=(item.text||'').replace(/^[ \t]*(FOUL|LEGAL|LOSS|INFO)[ \t]*\n?/,'').trim();
        var paras=body.split(/\n\n+/);
        var html='';
        for(var p=0;p<paras.length;p++){
            var txt=paras[p].trim(); if(!txt) continue;
            var label=PARA_LABELS[p]||'';
            html+='<div style="'+(p>0?'margin-top:14px;border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;':'')+'">'+
                (label?'<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:#5a7898;margin-bottom:5px;">'+label+'</div>':'')+
                '<div style="line-height:1.75;font-size:15px;color:#e8f0f8;">'+esc(txt).replace(/\n/g,'<br>')+'</div>'+
                '</div>';
        }
        d.innerHTML+=html||'<div style="line-height:1.75;font-size:15px;color:#e8f0f8;">'+esc(body)+'</div>';
    }
    return d;
}
function renderJudgeHistory(){
    var targets=['verdict-bubble','js-verdict-bubble'];
    for(var t=0;t<targets.length;t++){
        var el=document.getElementById(targets[t]); if(!el) continue;
        el.innerHTML='';
        for(var i=0;i<judgeHistory.length;i++) el.appendChild(_buildJudgeItem(judgeHistory[i],i===0));
    }
}

function calcStreak(form){
    if(!form.length) return {cur:0,best:0,curType:'-'};
    var cur=1,best=1,curType=form[form.length-1];
    for(var i=form.length-2;i>=0;i--){ if(form[i]===curType) cur++; else break; }
    for(var s=1,j=1;j<form.length;j++){ s=(form[j]===form[j-1])?s+1:1; if(s>best) best=s; }
    return {cur:cur,best:best,curType:curType};
}
function setStatsFilter(f){
  statsFilter=f;
  var chips=document.querySelectorAll('.stat-chip');
  for(var i=0;i<chips.length;i++){
    var match=chips[i].getAttribute('data-filter')===f;
    chips[i].className='stat-chip'+(match?' on':'');
  }
  renderStats();
}
function _gameType(g){ return g.gameType||'8ball'; }
function renderStats(){
  var body = document.getElementById('stats-body'); body.innerHTML = '';
  var ps = getActive(), rows = [];
  var gs = DB.gg();
  if(statsFilter!=='all'){
    gs=gs.filter(function(g){ return _gameType(g)===statsFilter; });
  }

  for(var i=0; i<ps.length; i++){
    var p=ps[i],wins=0,losses=0,total=0,form=[],totalDur=0,maxBreak=0;
    for(var j=0; j<gs.length; j++){
      if(plInGame(gs[j],p.id)){
        total++;
        totalDur += gs[j].dur||0;
        if(plWon(gs[j],p.id)){ wins++; form.push('W'); } else { losses++; form.push('L'); }
        if(gs[j].snookerData && gs[j].snookerData.highestBreak && gs[j].snookerData.highestBreak[p.id]){
          if(gs[j].snookerData.highestBreak[p.id]>maxBreak) maxBreak=gs[j].snookerData.highestBreak[p.id];
        }
      }
    }
    if(total>0){
      var sk=calcStreak(form);
      rows.push({p:p,w:wins,l:losses,t:total,pct:Math.round(wins*100/total),form:form.slice(-7),streak:sk,avgDur:Math.round(totalDur/total),hb:maxBreak});
    }

  rows.sort(function(a,b){ return b.pct-a.pct||b.w-a.w; });

  // Per-player cards
  var showHb = statsFilter==='snooker';
  for(var k=0;k<rows.length;k++){
    var r=rows[k], formHtml='';
    for(var f=0;f<r.form.length;f++) formHtml+='<div class="form-dot '+(r.form[f]==='W'?'form-win':'form-loss')+'"></div>';

    html+='<div class="widget"><div class="flex jb ac">'+

      '<div><div style="font-weight:800;font-size:18px;">'+esc(r.p.name)+'</div><div class="flex ac" style="margin-top:5px;">'+formHtml+'</div></div></div>'+

}

    var n1=g.mode==='singles'?(_h0?_h0.name:'?'):(g.tA?g.tA.name:'Team A');

    var snookerLine='';
    if(g.snookerData){
      var maxHb=Math.max(g.snookerData.highestBreak[g.pids[0]]||0, g.snookerData.highestBreak[g.pids[1]]||0);
      snookerLine='<div style="font-size:13px;color:#94a3b8;margin-top:4px;">Score: <strong style="color:#fff;">'+g.snookerData.scoreA+' &mdash; '+g.snookerData.scoreB+'</strong> &middot; Top break: <strong style="color:#fff;">'+maxHb+'</strong></div>';
    }
    html+='<div class="hcard"><div class="flex jb ac"><div>'+typeBadge+'<span style="font-size:10px;font-weight:800;color:#5a7898;text-transform:uppercase;">'+fmtDate(g.date)+'</span></div><div style="font-size:10px;color:#5a7898;">'+fmtDur(g.dur||0)+'</div></div>'+
      '<div style="font-size:18px;font-weight:700;margin:8px 0 4px;">'+esc(n1)+' vs '+esc(n2)+'</div>'+
      '<div style="font-size:11px;color:#ebbf52;font-weight:800;text-transform:uppercase;">Winner: '+esc(wd)+'</div>'+
      snookerLine+
      '</div>';
  }
  l.innerHTML=html;
}

// ==========================================
// UTILITIES
// ==========================================
function uid(){ return Math.random().toString(36).substring(2,10); }
function esc(s){ var d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function fmtDur(s){ var m=Math.floor(s/60),sc=s%60; return m+'m '+(sc<10?'0':'')+sc+'s'; }
function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function avColor(name){
    var cols=['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#10b981','#06b6d4','#3b82f6','#14b8a6'];
    var h=0; for(var i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))%cols.length;
    return cols[Math.abs(h)%cols.length];
}
function getActive(){ return DB.gp().filter(function(p){ return p.active!==false; }); }
function byId(id){ var ps=DB.gp(); for(var i=0;i<ps.length;i++) if(ps[i].id===id) return ps[i]; return null; }
function plInGame(g,id){
    if(g.mode==='singles') return g.pids&&(g.pids[0]===id||g.pids[1]===id);
    return (g.tA&&g.tA.pids&&g.tA.pids.indexOf(id)!==-1)||(g.tB&&g.tB.pids&&g.tB.pids.indexOf(id)!==-1);
}
function plWon(g,id){
    if(g.mode==='singles') return g.wid===id;
    if(g.wt==='A') return g.tA&&g.tA.pids&&g.tA.pids.indexOf(id)!==-1;
    if(g.wt==='B') return g.tB&&g.tB.pids&&g.tB.pids.indexOf(id)!==-1;
    return false;
}
function plRec(id, gs){
    if(!gs) gs=DB.gg();
    var w=0,l=0;
    for(var i=0;i<gs.length;i++){ if(plInGame(gs[i],id)){ if(plWon(gs[i],id))w++; else l++; } }
    return {w:w,l:l};
}

function resolveTeamMembers(team){
    if(!team||!team.pids||!team.pids.length) return '';
    var names=[];
    for(var i=0;i<team.pids.length;i++){ var p=byId(team.pids[i]); if(p) names.push(p.name); }
    return names.join(', ');
}

// ==========================================
// ADMIN PIN OVERLAY (for in-app actions)
// ==========================================
var _apmBuf='', _apmFails=0, _apmLocked=false, _apmCb=null;
function requireAdmin(action, fn){
    _apmBuf=''; _apmFails=0; _apmLocked=false; _apmCb=fn;
    document.getElementById('apm-subtitle').innerText=action||'Enter Admin PIN';
    _apmRender(); _apmErr('');
    document.getElementById('admin-pin-overlay').style.display='flex';
}
function apmKey(k){ if(_apmLocked||_apmBuf.length>=4) return; _apmBuf+=k; _apmRender(); if(_apmBuf.length===4) setTimeout(apmCheck,150); }
function apmBack(){ if(!_apmLocked){ _apmBuf=_apmBuf.slice(0,-1); _apmRender(); } }
function apmClear(){ if(!_apmLocked){ _apmBuf=''; _apmRender(); _apmErr(''); } }
function _apmRender(){ for(var i=0;i<4;i++){ var d=document.getElementById('apd'+i); if(d) d.className='pin-dot'+(i<_apmBuf.length?' filled':''); } }
function _apmErr(msg){ var e=document.getElementById('apm-err'); if(e) e.innerText=msg; }
function apmCheck(){
    var stored=localStorage.getItem('admin_pin')||'0304';
    if(_apmBuf===stored){
        _apmFails=0; _apmLocked=false; _apmBuf='';
        document.getElementById('admin-pin-overlay').style.display='none';
        if(_apmCb){ var cb=_apmCb; _apmCb=null; cb(); }
    } else {
        _apmFails++; _apmBuf=''; _apmRender();
        var delay=Math.min(1000*_apmFails,8000); _apmLocked=true;
        _apmErr(_apmFails>=3?'Too many attempts — wait '+Math.ceil(delay/1000)+'s':'Incorrect PIN');
        setTimeout(function(){ _apmLocked=false; _apmErr(''); }, delay);
    }
}
function apmCancel(){ _apmBuf=''; _apmCb=null; document.getElementById('admin-pin-overlay').style.display='none'; WinController.cancel(); }
